background {
    monitor =
    path = ~/.config/walls/background.jpg
    blur_passes = 2
    blur_size = 3
}

input-field {
    monitor =
    size = 320, 55
    outline_thickness = 0
    outer_color = rgb(8d8d8d)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(b6b6b6)
    placeholder_text = Password
    dots_size = 0.25
    dots_spacing = 0.3
    fade_on_empty = false
    rounding = 0
    font_family = IosevkaNerdFont
    fail_text = <i>($ATTEMPTS) Bad Password</i>
    fail_inner_color = rgba(0, 0, 0, 0.5) 
}

label {
    monitor =
    text = $TIME
    color = rgb(ffffff)
    font_size = 100
    font_family = IosevkaNerdFont
    position = 0, 150
    halign = center
    valign = center
}
