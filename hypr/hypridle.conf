general {
    lock_cmd = pidof hyprlock || hyprlock       # runs on dbus lock event (like loginctl lock-session)
    before_sleep_cmd = loginctl lock-session    # locks cleanly before machine suspends
    after_sleep_cmd = swaymsg "output * power on" # wakes monitors up safely on system resume
}

# Listener 1: Lock screen at 10 minutes (600s)
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Listener 2: Turn off screen at 15 minutes (900s)
listener {
    timeout = 900
    on-timeout = swaymsg "output * power off"
    on-resume = swaymsg "output * power on"
}

